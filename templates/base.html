    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              DEFAULT: '#1a365d',
              light: '#2c5282',
              dark: '#1a202c'
            },
            gold: {
              DEFAULT: '#d69e2e',
              light: '#ecc94b',
              dark: '#b7791f'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif']
          }
        }
      }
    }

  <style type="text/tailwindcss">
    @layer utilities {
      .scroll-smooth { scroll-behavior: smooth; }
    }
    @layer base {
      html { scroll-behavior: smooth; }
      details summary::-webkit-details-marker { display: none; }
      details summary { list-style: none; }
    }
  </style>
  <style>
    /* Carrier carousel animation */
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .carousel-track {
      display: flex;
      animation: scroll 30s linear infinite;
      width: max-content;
    }
    .carousel-track:hover {
      animation-play-state: paused;
    }
    .carousel-container {
      overflow: hidden;
      mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
    }
    /* Secondary services: hidden on mobile by default, always visible on desktop */
    .secondary-service {
      display: none;
    }
    .secondary-service.expanded {
      display: block;
    }
    @media (min-width: 768px) {
      .secondary-service {
        display: block !important;
      }
    }
  </style>
</head>
<body class="font-sans text-gray-600 leading-relaxed" data-variant="{{variant_id}}" data-niche="{{niche_slug}}">
  {{section:header}}

  <!-- Main Content -->
  <main>
    {{section:hero}}
    {{section:why-choose}}
    {{section:services}}
    {{section:about}}
    {{section:testimonials}}
    {{section:carriers}}
    {{section:faq}}
    {{section:contact}}
  </main>

  {{section:footer}}

  <script>lucide.createIcons();</script>
  <script>
// Scroll shadow on header
const header = document.querySelector('header');
window.addEventListener('scroll', () => {
  header.classList.toggle('shadow-lg', window.scrollY > 10);
});

// Mobile menu toggle
const menuBtn = document.getElementById('menu-toggle');
const mobileNav = document.getElementById('mobile-nav');
const menuIconOpen = document.getElementById('menu-icon-open');
const menuIconClose = document.getElementById('menu-icon-close');
menuBtn.addEventListener('click', () => {
  const isHidden = mobileNav.classList.toggle('hidden');
  menuIconOpen.classList.toggle('hidden', !isHidden);
  menuIconClose.classList.toggle('hidden', isHidden);
});
mobileNav.querySelectorAll('a').forEach(a => {
  a.addEventListener('click', () => {
    mobileNav.classList.add('hidden');
    menuIconOpen.classList.remove('hidden');
    menuIconClose.classList.add('hidden');
  });
});

// Services expand/collapse (mobile)
const servicesBtn = document.getElementById('services-toggle');
if (servicesBtn) {
  const secondaryServices = document.querySelectorAll('.secondary-service');
  const toggleText = servicesBtn.querySelector('span');
  const toggleIcon = servicesBtn.querySelector('[data-lucide="chevron-down"]');
  let expanded = false;
  servicesBtn.addEventListener('click', () => {
    expanded = !expanded;
    secondaryServices.forEach(el => el.classList.toggle('expanded', expanded));
    if (toggleText) toggleText.textContent = expanded ? 'Show Less' : 'View All Services';
    if (toggleIcon) toggleIcon.classList.toggle('rotate-180', expanded);
  });
}
  </script>
  <!-- Calendly widget script -->
  <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>

  <!-- Conversion tracking: fires when a Calendly booking is completed -->
  <script>
  window.addEventListener('message', function(e) {
    if (e.data && e.data.event === 'calendly.event_scheduled') {
      var variant = document.body.dataset.variant || 'unknown';
      var niche = document.body.dataset.niche || 'unknown';
      // Meta Pixel
      if (typeof fbq !== 'undefined') {
        fbq('track', 'Schedule', { content_category: niche, content_name: 'variant_' + variant });
      }
      // GA4
      if (typeof gtag !== 'undefined') {
        gtag('event', 'calendly_booking', { niche: niche, variant: variant });
      }
    }
  });
  </script>

  <!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "1eb649f75ee44207bde8d74bd95b2396"}'></script><!-- End Cloudflare Web Analytics -->
</body>

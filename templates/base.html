    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              DEFAULT: '#1a365d',
              light: '#2c5282',
              dark: '#1a202c'
            },
            gold: {
              DEFAULT: '#d69e2e',
              light: '#ecc94b',
              dark: '#b7791f'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .scroll-smooth { scroll-behavior: smooth; }
    }
    @layer base {
      html { scroll-behavior: smooth; }
      details summary::-webkit-details-marker { display: none; }
      details summary { list-style: none; }
    }
  </style>
  <style>
    /* Carrier carousel animation */
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .carousel-track {
      display: flex;
      animation: scroll 30s linear infinite;
      width: max-content;
    }
    .carousel-track:hover {
      animation-play-state: paused;
    }
    .carousel-container {
      overflow: hidden;
      mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
    }
    /* Secondary services: hidden on mobile by default, always visible on desktop */
    .secondary-service {
      display: none;
    }
    .secondary-service.expanded {
      display: block;
    }
    @media (min-width: 768px) {
      .secondary-service {
        display: block !important;
      }
    }
    /* Hide Calendly widget scrollbar — content fits, scrollbar is cosmetic noise */
    .calendly-inline-widget {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .calendly-inline-widget::-webkit-scrollbar {
      display: none;
    }
    /* A/B: early CTA placement
       Variant A (default): embed at bottom only
       Variant B: embed after hero, hide embed at bottom */
    #contact-early { display: none; }
    body[data-variant="b"] #contact-early { display: block; }
    body[data-variant="b"] #contact-embed-wrapper { display: none; }
  </style>
</head>
<body class="font-sans text-gray-600 leading-relaxed pb-16 md:pb-0" data-variant="{{variant_id}}" data-niche="{{niche_slug}}">
  {{section:header}}

  <!-- Main Content -->
  <main>
    {{section:hero}}
    {{section:contact-early}}
    {{section:why-choose}}
    {{section:services}}
    {{section:about}}
    {{section:testimonials}}
    {{section:carriers}}
    {{section:faq}}
    {{section:contact}}
  </main>

  {{section:footer}}

  <script>lucide.createIcons();</script>
  <script>
// Scroll shadow on header
const header = document.querySelector('header');
window.addEventListener('scroll', () => {
  header.classList.toggle('shadow-lg', window.scrollY > 10);
});

// Mobile menu toggle
const menuBtn = document.getElementById('menu-toggle');
const mobileNav = document.getElementById('mobile-nav');
const menuIconOpen = document.getElementById('menu-icon-open');
const menuIconClose = document.getElementById('menu-icon-close');
menuBtn.addEventListener('click', () => {
  const isHidden = mobileNav.classList.toggle('hidden');
  menuIconOpen.classList.toggle('hidden', !isHidden);
  menuIconClose.classList.toggle('hidden', isHidden);
});
mobileNav.querySelectorAll('a').forEach(a => {
  a.addEventListener('click', () => {
    mobileNav.classList.add('hidden');
    menuIconOpen.classList.remove('hidden');
    menuIconClose.classList.add('hidden');
  });
});

// Services expand/collapse (mobile)
const servicesBtn = document.getElementById('services-toggle');
if (servicesBtn) {
  const secondaryServices = document.querySelectorAll('.secondary-service');
  const toggleText = servicesBtn.querySelector('span');
  const toggleIcon = servicesBtn.querySelector('[data-lucide="chevron-down"]');
  let expanded = false;
  servicesBtn.addEventListener('click', () => {
    expanded = !expanded;
    secondaryServices.forEach(el => el.classList.toggle('expanded', expanded));
    if (toggleText) toggleText.textContent = expanded ? 'Show Less' : 'View All Services';
    if (toggleIcon) toggleIcon.classList.toggle('rotate-180', expanded);
  });
}
  </script>
  <!-- Calendly widget script -->
  <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>

  <!-- Remove scrollbar from Calendly iframes as soon as they're created -->
  <script>
  (function() {
    var observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        mutation.addedNodes.forEach(function(node) {
          if (node.nodeName === 'IFRAME' && node.closest && node.closest('.calendly-inline-widget')) {
            node.setAttribute('scrolling', 'no');
            node.style.overflow = 'hidden';
          }
        });
      });
    });
    document.querySelectorAll('.calendly-inline-widget').forEach(function(widget) {
      observer.observe(widget, { childList: true, subtree: true });
    });
  })();
  </script>

  <!-- Conversion tracking: fires when a Calendly booking is completed -->
  <script>
  window.addEventListener('message', function(e) {
    if (!e.data || !e.data.event) return;

    // Auto-resize the Calendly widget to avoid internal scrollbars
    if (e.data.event === 'calendly.event_type_viewed' || e.data.event === 'calendly.profile_page_viewed') {
      var h = e.data.payload && e.data.payload.height;
      if (h) {
        var widget = document.querySelector('.calendly-inline-widget');
        if (widget) widget.style.height = (h + 50) + 'px';
      }
    }

    if (e.data.event === 'calendly.event_scheduled') {
      var variant = document.body.dataset.variant || 'unknown';
      var niche = document.body.dataset.niche || 'unknown';
      // Meta Pixel
      if (typeof fbq !== 'undefined') {
        fbq('track', 'Schedule', { content_category: niche, content_name: 'variant_' + variant });
      }
      // GA4
      if (typeof gtag !== 'undefined') {
        gtag('event', 'calendly_booking', { niche: niche, variant: variant });
      }
    }
  });
  </script>

  <!-- Variant-aware hero CTA: point to early embed on variant B -->
  <script>
  (function() {
    if (document.body.dataset.variant === 'b') {
      document.querySelectorAll('a[href="#contact"]').forEach(function(a) {
        // Only rewrite the hero CTA, not nav links
        if (a.closest('#home')) a.href = '#contact-early';
      });
    }
  })();
  </script>

  <!-- Sticky mobile CTA bar -->
  <div id="sticky-cta" class="fixed bottom-0 left-0 right-0 z-50 md:hidden bg-navy border-t-2 border-gold shadow-2xl transition-transform duration-300 translate-y-full">
    <div class="flex items-stretch">
      <a id="sticky-book-btn" href="/intake" class="flex-1 flex items-center justify-center gap-2 bg-gold hover:bg-gold-dark text-navy font-bold text-base py-4 px-4 transition-colors">
        <i data-lucide="file-text" class="w-5 h-5 flex-shrink-0" aria-hidden="true"></i>
        Get My Free Quote
      </a>
      <a href="tel:6166164884" class="flex items-center justify-center gap-2 bg-navy hover:bg-navy-light text-white font-bold text-base py-4 px-5 border-l border-navy-light transition-colors">
        <i data-lucide="phone" class="w-5 h-5" aria-hidden="true"></i>
      </a>
    </div>
  </div>
  <script>
  (function() {
    var bar = document.getElementById('sticky-cta');
    var bookBtn = document.getElementById('sticky-book-btn');

    // Point book button to correct section based on variant
    if (document.body.dataset.variant === 'b') {
      bookBtn.href = '#contact-early';
    } else {
      bookBtn.href = '#contact';
    }

    // Slide up after 2 seconds
    setTimeout(function() {
      bar.classList.remove('translate-y-full');
      lucide.createIcons();
    }, 2000);

    // Hide when Calendly is visible on screen (user reached it)
    var calendlySection = document.getElementById(
      document.body.dataset.variant === 'b' ? 'contact-early' : 'contact'
    );
    if (calendlySection) {
      var obs = new IntersectionObserver(function(entries) {
        bar.classList.toggle('translate-y-full', entries[0].isIntersecting);
      }, { threshold: 0.2 });
      obs.observe(calendlySection);
    }
  })();
  </script>
